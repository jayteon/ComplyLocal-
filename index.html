        <div class="metrics">
            <div class="metric"><h3>Total Waste (This Month)</h3><div class="value" id="waste-month">0 lbs</div><div class="sub">vs last month</div></div>
            <div class="metric"><h3>Diversion Rate</h3><div class="value" id="diversion-rate">0%</div><div class="sub">organics diverted</div></div>
            <div class="metric"><h3>Logs This Month</h3><div class="value" id="logs-count">0</div><div class="sub">entries</div></div>
            <div class="metric"><h3>Export Report</h3><button id="export-pdf" disabled>PDF (Pro Only)</button></div>
        </div>

        <div id="chart-container">
            <canvas id="wasteChart"></canvas>
        </div>

        <div id="log-form">
            <h3>Log Daily Waste</h3>
            <input type="date" id="log-date" required>
            <input type="number" id="total-lbs" placeholder="Total waste (lbs)" min="0" step="0.1" required>
            <input type="number" id="diverted-lbs" placeholder="Diverted/Organics (lbs)" min="0" step="0.1" required>
            <button id="submit-log">Save Log</button>
        </div>

        <div class="recent">
            <h2>Recent Logs</h2>
            <div id="recent-entries"></div>
        </div>

        <!-- Simulate Pro for testing (remove or hide later) -->
        <button id="simulate-pro" style="margin: 20px auto; display: block;">Simulate Pro Unlock (Test Only)</button>
    </div>

    <script>
        let logs = JSON.parse(localStorage.getItem('wasteLogs')) || [];
        let chart;
        let isPro = localStorage.getItem('isPro') === 'true';

        function saveLogs() { localStorage.setItem('wasteLogs', JSON.stringify(logs)); updateDashboard(); }

        function updateDashboard() {
            const now = new Date();
            const thisMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
            const monthLogs = logs.filter(log => log.date.startsWith(thisMonth));

            const total = monthLogs.reduce((sum, log) => sum + log.total, 0);
            const diverted = monthLogs.reduce((sum, log) => sum + log.diverted, 0);
            const rate = total > 0 ? Math.round((diverted / total) * 100) : 0;

            document.getElementById('waste-month').textContent = total.toFixed(1) + ' lbs';
            document.getElementById('diversion-rate').textContent = rate + '%';
            document.getElementById('logs-count').textContent = monthLogs.length;

            const statusEl = document.getElementById('status');
            const detailEl = document.getElementById('status-detail');
            const card = document.getElementById('compliance-card');
            if (rate >= 80) { 
                statusEl.textContent = 'Compliant'; 
                card.className = 'compliance good'; 
                detailEl.textContent = 'Great job – keep it up!';
            } else if (rate >= 50) { 
                statusEl.textContent = 'At Risk'; 
                card.className = 'compliance warning'; 
                detailEl.textContent = 'Improve diversion to stay safe';
            } else { 
                statusEl.textContent = 'Non-Compliant'; 
                card.className = 'compliance'; 
                detailEl.textContent = 'Action needed – check DSNY rules';
            }

            const recentDiv = document.getElementById('recent-entries');
            recentDiv.innerHTML = '';
            logs.slice(-5).reverse().forEach(log => {
                const div = document.createElement('div');
                div.className = 'entry';
                div.innerHTML = `<span>${log.date}: ${log.total} lbs total (${log.diverted} diverted)</span><span>${(log.diverted / log.total * 100 || 0).toFixed(0)}%</span>`;
                recentDiv.appendChild(div);
            });

            const dates = [...new Set(logs.map(l => l.date))].sort().slice(-30);
            const totals = dates.map(d => logs.filter(l => l.date === d).reduce((s, l) => s + l.total, 0));
            const divertedData = dates.map(d => logs.filter(l => l.date === d).reduce((s, l) => s + l.diverted, 0));

            if (chart) chart.destroy();
            chart = new Chart(document.getElementById('wasteChart'), {
                type: 'bar',
                data: { labels: dates, datasets: [{ label: 'Total Waste', data: totals, backgroundColor: '#3b82f6' }, { label: 'Diverted', data: divertedData, backgroundColor: '#10b981' }] },
                options: { responsive: true, scales: { y: { beginAtZero: true } } }
            });
        }

        function exportCSV() {
            if (logs.length === 0) return alert('No logs to export!');
            let csv = 'Date,Total lbs,Diverted lbs,Diversion %\n';
            logs.forEach(log => {
                csv += `${log.date},${log.total},${log.diverted},${(log.diverted / log.total * 100 || 0).toFixed(2)}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'waste-report.csv'; a.click();
        }

        function updateProFeatures() {
            document.getElementById('export-pdf').disabled = !isPro;
            if (!isPro) {
                document.getElementById('wasteChart').style.opacity = 0.5;
            }
        }

        document.getElementById('export-pdf').onclick = () => {
            if (!isPro) return alert('Upgrade to Pro for PDF exports!');
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text('NYC Food Waste Report - ComplyLocal Pro', 10, 10);
            doc.text(`Total Waste This Month: ${document.getElementById('waste-month').textContent}`, 10, 20);
            doc.text(`Diversion Rate: ${document.getElementById('diversion-rate').textContent}`, 10, 30);
            logs.forEach((log, i) => doc.text(`${log.date}: ${log.total} lbs (${log.diverted} diverted)`, 10, 40 + i*10));
            doc.save('complylocal-report.pdf');
        };

        document.getElementById('simulate-pro').onclick = () => {
            isPro = true;
            localStorage.setItem('isPro', 'true');
            updateProFeatures();
            alert('Pro unlocked for testing!');
        };

        document.getElementById('open-log').onclick = document.getElementById('log-waste').onclick = () => {
            document.getElementById('log-form').style.display = 'block';
        };

        document.getElementById('submit-log').onclick = () => {
            const date = document.getElementById('log-date').value;
            const total = parseFloat(document.getElementById('total-lbs').value) || 0;
            const diverted = parseFloat(document.getElementById('diverted-lbs').value) || 0;
            if (!date || total < 0 || diverted < 0 || diverted > total) return alert('Check inputs!');
            logs.push({ date, total, diverted });
            saveLogs();
            document.getElementById('log-form').style.display = 'none';
            alert('Logged!');
        };

        updateDashboard();
        updateProFeatures();
    </script>
</body>
</html>
